spring:
  application:
    name: trustlend-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trustlend}
    username: ${DB_USERNAME:trustlend}
    password: ${DB_PASSWORD:trustlend}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}
