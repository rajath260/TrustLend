name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repository-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository
        run: |
          test -f README.md
          test -f docs/product/mvp-scope.md
          test -f docs/architecture/system-architecture.md

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/trustlend-api
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests
        run: ./mvnw test -q
