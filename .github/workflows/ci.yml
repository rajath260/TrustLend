name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repository-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository
        run: |
          test -f README.md
          test -f docs/product/mvp-scope.md
          test -f docs/architecture/system-architecture.md
          echo "TrustLend repository validation passed."
